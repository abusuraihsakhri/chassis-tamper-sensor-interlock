name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test and build tools
        run: python -m pip install --upgrade pip pytest build
      - name: Run tests
        run: python -m pytest -q
      - name: Build package
        run: python -m build
      - name: Check installed console command
        run: |
          python -m pip install .
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          chassis-tamper-sensor-interlock eval --rail-v 3.3 --json > smoke.json
          python - <<'PY'
          import json
          with open("smoke.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["interlock_state"] == "ARMED_SECURE"
          PY
      - name: Run CSV smoke test
        run: python cli.py batch -i sample.csv -o out_smoke.csv
      - name: Check installed packages
        run: python -m pip check
