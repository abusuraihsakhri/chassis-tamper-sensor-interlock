[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chassis-tamper-sensor-interlock"
version = "2.0.0"
description = "Chassis Intrusion Detection & Zeroization Interlock Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
chassis-tamper-sensor-interlock = "chassis_tamper.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/chassis-tamper-sensor-interlock"
Repository = "https://github.com/abusuraihsakhri/chassis-tamper-sensor-interlock.git"
