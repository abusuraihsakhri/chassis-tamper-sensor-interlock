version: '3.8'

services:
  chassis-tamper-sensor-interlock:
    build: .
    container_name: chassis-tamper-sensor-interlock
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=chassis-tamper-sensor-interlock-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
